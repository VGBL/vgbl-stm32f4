[package]
name = "vgbl-stm32f4-bootloader"
description = "Implementations of the VGBL bootloader framework for the STMicroelectronics STM32 family"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
# Link to run from RAM. Copyup copies the image there from flash, so flash erases don't stall execution
copyup = []

[dependencies]
commkit = { path = "../../commkit", version = "0.1.0" }
commkit-uart = { path = "../../commkit-uart", version = "0.1.0" }
commkit-hal-stm32f4xx = { path = "../../commkit-hal-stm32f4xx", version = "0.1.0" }
commkit-iso-14229-1 = { path = "../../commkit-iso-14229-1", version = "0.1.0" }
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
fugit = "0.3"
nb = "1.1"
panic-halt = "1.0"
stm32f4xx-hal = { version = "0.23", features = ["stm32f446"] }
vgbl = { path = "../../vgbl", version = "0.1.0" }
